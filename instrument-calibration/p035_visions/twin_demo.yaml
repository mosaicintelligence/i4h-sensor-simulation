# Twin / reveal-demo material overlay.
#
# Stock acoustics stay in ultrasound-raytracing/csrc/core/material.cpp
# (PR #20 literature table). This file does NOT replace that table.
# Call IvusSimConfig.from_yaml(...).apply_materials(rs.Materials()) to
# opt in. Probe / PSF / TGC stay in volcano_s5i.yaml.
#
# Wall contrast is backscatter (mu0 / sigma). Interlayer Z steps stay
# small so intima/media Fresnel is quiet; the lumen border is the one
# lifted interface. specularity is Mattausch n and must stay >= 1.
#
# intima Z 1.87 vs lumen 1.68 → ~0.28% intensity reflection
# (PR #20 is 1.92 / ~0.44%).
# calcified_plaque sits between fibrous and full calc (PR #20 is
# Z 2.23, α 20, σ 16). α 12 keeps the back specular; σ 6 is bright
# without the 46× vessel-wall saturate.

materials:
  - name: intima
    impedance_mrayl: 1.87
    attenuation_db_per_cm_mhz: 0.93
    speed_of_sound_m_per_s: 1600.0
    mu0: 0.55
    mu1: 0.6
    sigma: 0.49
    specularity: 1.0
  - name: media
    impedance_mrayl: 1.83
    attenuation_db_per_cm_mhz: 0.80
    speed_of_sound_m_per_s: 1570.0
    mu0: 0.12
    mu1: 0.15
    sigma: 0.10
    specularity: 1.0
  - name: adventitia
    impedance_mrayl: 1.86
    attenuation_db_per_cm_mhz: 1.10
    speed_of_sound_m_per_s: 1610.0
    mu0: 0.95
    mu1: 0.75
    sigma: 0.85
    specularity: 1.0
  - name: calcified_plaque
    impedance_mrayl: 2.12
    attenuation_db_per_cm_mhz: 12.0
    speed_of_sound_m_per_s: 2000.0
    mu0: 1.25
    mu1: 1.25
    sigma: 6.0
    specularity: 1.0
  - name: lipid_pool
    impedance_mrayl: 1.70
    attenuation_db_per_cm_mhz: 0.4
    speed_of_sound_m_per_s: 1480.0
    mu0: 0.12
    mu1: 0.08
    sigma: 0.05
    specularity: 1.0
  - name: fibrous_plaque
    impedance_mrayl: 2.02
    attenuation_db_per_cm_mhz: 1.4
    speed_of_sound_m_per_s: 1620.0
    mu0: 1.5
    mu1: 1.0
    sigma: 0.8
    specularity: 1.0
  - name: thrombus
    impedance_mrayl: 1.70
    attenuation_db_per_cm_mhz: 0.4
